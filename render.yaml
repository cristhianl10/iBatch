services:
  - type: web
    name: ibatch-backend
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        value: jdbc:mysql://ibatch-mysql-ibatch-cloud.j.aivencloud.com:14936/defaultdb?sslMode=REQUIRED&serverTimezone=UTC
      - key: DB_USERNAME
        value: avnadmin
      - key: DB_PASSWORD
        sync: false
      - key: APP_AUTH_USERNAME
        value: operator
      - key: APP_AUTH_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://ibatch-frontend.vercel.app
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_COOKIE_SAME_SITE
        value: none
      - key: APP_FILES_INPUT_DIR
        value: /tmp/ibatch-input
      - key: DB_POOL_MAX_SIZE
        value: "5"
      - key: DB_POOL_MIN_IDLE
        value: "0"
