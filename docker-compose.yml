services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ibatch
      MYSQL_USER: ${MYSQL_USER:-ibatch}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/001_create_database.sql:/docker-entrypoint-initdb.d/001_create_database.sql:ro
      - ./database/002_create_batch_processing_model.sql:/docker-entrypoint-initdb.d/002_create_batch_processing_model.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DB_URL: jdbc:mysql://db:3306/ibatch?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: ${MYSQL_USER:-ibatch}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      APP_AUTH_USERNAME: ${APP_AUTH_USERNAME}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD}
      APP_FILES_INPUT_DIR: /data/input
      CORS_ALLOWED_ORIGINS: ${PUBLIC_FRONTEND_URL}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      SESSION_COOKIE_SAME_SITE: ${SESSION_COOKIE_SAME_SITE:-lax}
      MAX_FILE_SIZE_BYTES: ${MAX_FILE_SIZE_BYTES:-52428800}
      MAX_FILE_RECORDS: ${MAX_FILE_RECORDS:-1000000}
    volumes:
      - csv_input:/data/input
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_BACKEND_URL}
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"

volumes:
  mysql_data:
  csv_input:
